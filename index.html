<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bunya — Staging</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #e8eaed;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 32rem; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9aa0a6;
      border: 1px solid #2a2e35;
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 0.75rem; letter-spacing: -0.02em; }
    p { color: #9aa0a6; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Design stage · Private preview</span>
    <h1>Bunya</h1>
    <p>The official website is being designed. This staging page is a placeholder — the live design will appear here soon.</p>
  </div>
</body>
</html>
